<!doctype html>
<html lang="en" class="role-officer look-a" data-home="/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Evidence for a check</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;font-size:13px;line-height:1.5;color:#0F1115;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#1F4FD1}a:hover{color:#163B9E}
.app{display:flex;min-height:900px;background:#FFFFFF}
.side{width:232px;flex:none;background:#FAFAFB;border-right:1px solid #E6E8EC;display:flex;flex-direction:column;gap:16px;padding:12px;box-sizing:border-box}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-weight:600;font-size:14px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:#3D4250;text-decoration:none}
.nav a:hover{background:#F1F2F4;color:#0F1115}
.nav a.on{background:#EBEDF0;color:#0F1115;font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ct{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:#8A8F9C}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;color:#3D4250}
.av{width:22px;height:22px;border-radius:999px;background:#0F1115;color:#FFFFFF;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;border-bottom:1px solid #E6E8EC;display:flex;align-items:center;gap:8px;padding:0 24px;color:#5F6573;box-sizing:border-box}
.top a{color:#5F6573;text-decoration:none}.top b{color:#0F1115;font-weight:500}
h2{font-size:14px;font-weight:600;margin:0}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;color:#0F1115;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn:hover{background:#F7F8FA;color:#0F1115}
.btn.pri{background:#1F4FD1;border-color:#1F4FD1;color:#FFFFFF}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;background:#F1F2F4;color:#3D4250;gap:4px;white-space:nowrap}
.ok{background:#E9F6EF;color:#0B6B47}.warn{background:#FDF3DF;color:#8A5600}.err{background:#FCEBEA;color:#A8231B}.info{background:#EEF2FD;color:#1F4FD1}
.mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:#8A8F9C}
.ph{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-bottom:1px solid #E6E8EC;font-weight:500;box-sizing:border-box}
.claim{width:100%;border:0;border-bottom:1px solid #F0F1F3;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.claim.on{background:#EEF2FD}
.node{border:1px solid #E1E3E8;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;background:#FFFFFF}
.node.gap{border:1px dashed #E0A030;background:#FFFBF2}
.line{width:1px;height:14px;background:#CDD1D8;margin-left:16px}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,79,209,.35)}50%{box-shadow:0 0 0 4px rgba(31,79,209,0)}}
.page>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}.page>*:nth-child(4){animation-delay:.15s}.page>*:nth-child(5){animation-delay:.2s}
.col .card,.tbl .tr:not(.th),.panel .row,.panel .tr,.claim{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.col .card:nth-of-type(2),.tbl .tr:nth-child(3),.panel .tr:nth-child(3){animation-delay:.06s}
.col .card:nth-of-type(3),.tbl .tr:nth-child(4),.panel .tr:nth-child(4){animation-delay:.12s}
.tbl .tr:nth-child(5),.panel .tr:nth-child(5){animation-delay:.18s}.tbl .tr:nth-child(6),.panel .tr:nth-child(6){animation-delay:.24s}
.tbl .tr:nth-child(7){animation-delay:.3s}.tbl .tr:nth-child(8){animation-delay:.36s}.tbl .tr:nth-child(9){animation-delay:.42s}
.card{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,17,21,.08);border-color:#D5D8DF}
.btn{transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri:hover{box-shadow:0 0 0 3px rgba(31,79,209,.18)}
.card .btn.pri{animation:pulse 2.4s ease-in-out 1s 2}
.nav a{transition:background .15s,color .15s}
.nav a svg{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.nav a:hover svg{transform:translateX(2px)}
.tr,.row,.pick,.claim,.opt{transition:background .15s,border-color .15s}
a.tr:hover,.pick:hover,.claim:hover{background:#F7F8FA}
.pick.on,.claim.on{background:#EEF2FD}
.opt:hover{border-color:#B9C3E0}
.tabs button{transition:color .15s,border-color .2s}
.tabs button:hover{color:#0F1115}
.seg2 button{transition:background .15s,color .15s}
.badge{transition:background .2s,color .2s}
[role=dialog]{animation:pop .24s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}
.seg span,.meter span,.bar span{transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) .2s both}
.seg span:nth-child(2),.meter span:nth-child(2){animation-delay:.26s}.seg span:nth-child(3),.meter span:nth-child(3){animation-delay:.32s}.seg span:nth-child(4),.meter span:nth-child(4){animation-delay:.38s}.seg span:nth-child(5){animation-delay:.44s}
.node{transition:transform .18s,box-shadow .18s}.node:hover{transform:translateX(2px);box-shadow:0 2px 8px rgba(15,17,21,.06)}
.stat{transition:border-color .15s,transform .18s}.stat:hover{border-color:#D5D8DF;transform:translateY(-1px)}
.panel{transition:box-shadow .2s}
:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>

<link rel="stylesheet" href="looks.css">
<script>try{var L=new URLSearchParams(location.search).get("look")||(parent!==window&&parent.SBC_LOOK)||"";if(L)document.documentElement.classList.add("look-"+L)}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div class="app">
  <aside class="side">
    <div class="ws"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#1F4FD1"></path><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path></svg>SBC Capital</div>
    <nav class="nav" aria-label="Console">
      <a class="on" href="v2Board.dc.html"><svg viewBox="0 0 24 24"><path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"></path></svg>Board<span class="ct">7</span></a>
      <a href="v2Companies.dc.html"><svg viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15M9 21v-4h6v4M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"></path></svg>Companies</a>
      <a href="v2Buyers.dc.html"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5zM9 8V5h6v3"></path></svg>Buyers<span class="ct">3</span></a>
      <a href="v2Agents.dc.html"><svg viewBox="0 0 24 24"><path d="M16 20v-1a4 4 0 0 0-8 0v1M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"></path></svg>Agent panel</a>
      <a href="v2Audit.dc.html"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"></path></svg>Audit log</a>
    </nav>
    <div class="me"><span class="av">A</span>Officer A</div>
  </aside>

  <main class="main">
    <div class="top"><a href="v2Board.dc.html">Board</a><span>/</span><a href="v2Check.dc.html">Halvorsen Water Systems</a><span>/</span><b>Ownership</b>
      <span style="margin-left: auto; display: flex; gap: 8px"><button class="btn">Ask for extract</button><button class="btn pri">Confirm</button></span></div>

    <div style="display: grid; grid-template-columns: 320px minmax(0, 1fr) 280px; flex: 1; min-height: 0">
      <section aria-label="AI claims" style="border-right: 1px solid #E6E8EC; display: flex; flex-direction: column">
        <div class="ph">AI claims<span class="badge warn" style="margin-left: auto">Check</span></div>
        <sc-for list="{{claims}}" as="c" hint-placeholder-count="4">
          <button class="claim {{c.on}}" onClick="{{c.pick}}">
            <span>{{c.text}}</span>
            <span class="mono" style="font-size: 11px; color: {{c.srcColor}}">{{c.src}}</span>
          </button>
        </sc-for>
        <div style="margin-top: auto; padding: 12px 16px; border-top: 1px solid #E6E8EC" class="mono muted"><span style="font-size: 11px">4 documents · model v[x] · uploads treated as untrusted</span></div>
      </section>

      <section aria-label="Document" style="background: #F3F4F6; display: flex; flex-direction: column; min-width: 0">
        <div class="ph" style="background: #FFFFFF">{{doc.name}}<span class="mono muted" style="margin-left: auto; font-size: 12px; font-weight: 400">{{doc.page}}</span></div>
        <div style="padding: 24px; display: flex; justify-content: center">
          <div style="width: 100%; max-width: 520px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15,17,21,.12); padding: 40px 44px; display: flex; flex-direction: column; gap: 12px; font-family: 'Geist Mono', monospace; font-size: 12px; color: #3D4250; min-height: 520px; box-sizing: border-box">
            <span style="color: #0F1115; font-weight: 500">{{doc.heading}}</span>
            <span>{{doc.line1}}</span>
            <div style="height: 1px; background: #E6E8EC"></div>
            <span class="muted">[earlier entries]</span>
            <div style="background: #FFF3C4; outline: 2px solid #E0A030; padding: 6px 8px; color: #0F1115">{{doc.highlight}}</div>
            <span class="muted">[later entries]</span>
            <div style="height: 1px; background: #E6E8EC"></div>
            <span class="muted">[signature, date]</span>
          </div>
        </div>
      </section>

      <section aria-label="Ownership chain" style="border-left: 1px solid #E6E8EC; display: flex; flex-direction: column">
        <div class="ph">Chain to final owners</div>
        <div style="padding: 16px; display: flex; flex-direction: column">
          <div class="node"><span style="font-weight: 500">Halvorsen Water Systems</span><span class="muted" style="font-size: 12px">Applicant · DE</span></div>
          <div class="line"></div>
          <div class="node"><span style="font-weight: 500">Halvorsen Holding · 100%</span><span class="muted" style="font-size: 12px">Extract on file</span></div>
          <div class="line"></div>
          <div class="node"><span style="font-weight: 500">Erik Halvorsen · 40%</span><span class="muted" style="font-size: 12px">Person</span></div>
          <div class="line"></div>
          <div class="node gap"><span style="font-weight: 500">Nordkap Invest · 60%</span><span style="font-size: 12px; color: #8A5600">Cyprus · no extract</span></div>
          <div class="line" style="background: #E0A030"></div>
          <div class="node gap"><span style="font-weight: 500">Ingrid Moen</span><span class="muted" style="font-size: 12px">Person · via Nordkap</span></div>
        </div>
        <div style="margin-top: auto; padding: 16px; border-top: 1px solid #E6E8EC; display: flex; flex-direction: column; gap: 8px">
          <span class="muted" style="font-size: 12px">Decision</span>
          <button class="btn pri" style="justify-content: center">Confirm</button>
          <button class="btn" style="justify-content: center">Ask for extract</button>
          <button class="btn" style="justify-content: center">Mark short</button>
        </div>
      </section>
    </div>
  </main>
</div>
</template>
<script>window.SBC_ACTIONS = {"all": {"Messages": {"toast": "Messages is not part of this prototype yet"}, "Open messages": {"toast": "Messages is not part of this prototype yet"}}, "screen": {"Ask for extract": {"toast": "Request sent. It shows in the company's checklist", "done": "Asked"}, "Confirm": {"toast": "Document confirmed", "done": "Confirmed"}, "Mark short": {"toast": "Marked short. Added to the action plan", "go": "v2Plan"}}};</script>
<script src="dc-lite.js"></script>
<script>
DCLite.mount(document.getElementById('tpl'), function (DCLogic) {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 0 }; }
renderVals() {
  const data = [
    { text: 'Halvorsen Holding GmbH owns 100%.', src: 'Shareholder register · p.2', name: 'Shareholder register.pdf', page: 'p.2 / 3', heading: 'List of shareholders', line1: 'Halvorsen Water Systems GmbH, Hamburg', highlight: 'Halvorsen Holding GmbH · 25,000 EUR · 100%' },
    { text: 'Erik Halvorsen holds 40% of the holding.', src: 'Holding extract · p.1', name: 'Holding extract.pdf', page: 'p.1 / 2', heading: 'Register extract', line1: 'Halvorsen Holding GmbH, Hamburg', highlight: 'Erik Halvorsen · 40%' },
    { text: 'Nordkap Invest Ltd, Cyprus, holds 60%.', src: 'Holding extract · p.1', name: 'Holding extract.pdf', page: 'p.1 / 2', heading: 'Register extract', line1: 'Halvorsen Holding GmbH, Hamburg', highlight: 'Nordkap Invest Ltd (Cyprus) · 60%' },
    { text: 'Ingrid Moen owns Nordkap Invest.', src: 'Ownership chart · not official', name: 'Ownership chart.pdf', page: 'p.1 / 1', heading: 'Group structure (company prepared)', line1: 'Prepared by the applicant', highlight: 'Nordkap Invest Ltd ← Ingrid Moen 100%', warn: true }
  ];
  const sel = this.state.sel;
  const claims = data.map((d, i) => ({ text: d.text, src: d.src, srcColor: d.warn ? '#8A5600' : '#1F4FD1', on: i === sel ? 'on' : '', pick: () => this.setState({ sel: i }) }));
  return { claims, doc: data[sel] };
}
}

return Component;
}, document.getElementById('root'));
</script>
</body>
</html>
