<!doctype html>
<html lang="en" class="role-buyer look-a" data-home="/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Check a mark, console look with delight</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;font-size:13px;line-height:1.5;color:#0F1115;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#1F4FD1}
.app{display:flex;min-height:900px;background:#FFFFFF}
.side{width:232px;flex:none;background:#FAFAFB;border-right:1px solid #E6E8EC;display:flex;flex-direction:column;gap:16px;padding:12px;box-sizing:border-box}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-weight:600;font-size:14px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:#3D4250;text-decoration:none;transition:background .15s}
.nav a:hover{background:#F1F2F4;color:#0F1115}
.nav a.on{background:#EBEDF0;color:#0F1115;font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ct{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:#8A8F9C}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;border-bottom:1px solid #E6E8EC;display:flex;align-items:center;gap:8px;padding:0 24px;color:#5F6573;box-sizing:border-box}
.top b{color:#0F1115;font-weight:500}
.page{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px;max-width:760px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;color:#0F1115;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{background:#F7F8FA;color:#0F1115}.btn:active{transform:scale(.97)}
.btn.pri{background:#1F4FD1;border-color:#1F4FD1;color:#FFFFFF}.btn.pri:hover{box-shadow:0 0 0 3px rgba(31,79,209,.18);color:#FFFFFF}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;background:#F1F2F4;color:#3D4250;gap:4px;white-space:nowrap}
.ok{background:#E9F6EF;color:#0B6B47}.info{background:#EEF2FD;color:#1F4FD1}
.mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:#8A8F9C}
.panel{border:1px solid #E6E8EC;border-radius:8px;background:#FFFFFF}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;color:#3D4250}
input,textarea{font:13px 'Geist',sans-serif;border:1px solid #E1E3E8;border-radius:6px;padding:7px 10px;transition:border-color .15s,box-shadow .15s;box-sizing:border-box;width:100%}
input:focus,textarea:focus{outline:none;border-color:#1F4FD1;box-shadow:0 0 0 3px rgba(31,79,209,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 10px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;font:500 12px 'Geist',sans-serif;color:#3D4250;cursor:pointer;transition:all .15s}
.chip.on{background:#0F1115;border-color:#0F1115;color:#FFFFFF}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.hero{position:relative;overflow:hidden;border-radius:12px;background:radial-gradient(620px 340px at 72% 50%,rgba(31,79,209,.5),transparent 70%),#0E1220;color:#FFFFFF;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:center;padding:44px 48px;min-height:340px;box-sizing:border-box}
.lat{position:absolute;inset:0;opacity:.14;pointer-events:none;background-image:linear-gradient(115deg,transparent 49.6%,#7E9CFF 49.6%,#7E9CFF 50.4%,transparent 50.4%),linear-gradient(65deg,transparent 49.6%,#7E9CFF 49.6%,#7E9CFF 50.4%,transparent 50.4%);background-size:160px 120px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000);mask-image:linear-gradient(90deg,transparent 20%,#000)}
.eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9DB4FF}
.big{font-size:38px;font-weight:600;line-height:1.08;margin:0;letter-spacing:-.025em}
.lede{font-size:15px;color:#C9CDD6;max-width:440px}
.hbtn{height:36px;padding:0 14px;border-radius:6px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#FFFFFF;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background .15s,transform .1s}
.hbtn:hover{background:rgba(255,255,255,.14)}.hbtn:active{transform:scale(.97)}
.hbtn.pri{background:#1F4FD1;border-color:#1F4FD1}.hbtn.pri:hover{background:#3D6AF0;box-shadow:0 0 0 3px rgba(126,156,255,.25)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:rgba(126,156,255,.14);color:#C9D5FF;font-size:12px;font-weight:500}
.seg{display:inline-flex;padding:3px;border-radius:8px;background:rgba(255,255,255,.08);gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:6px;border:0;background:transparent;color:#C9CDD6;font:500 12px 'Geist',sans-serif;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:#FFFFFF}.seg button.on{background:#FFFFFF;color:#0E1220}
.copy>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.copy>*:nth-child(2){animation-delay:.08s}.copy>*:nth-child(3){animation-delay:.16s}.copy>*:nth-child(4){animation-delay:.24s}.copy>*:nth-child(5){animation-delay:.32s}
.spark{position:absolute;width:6px;height:6px;border-radius:1px;background:#7E9CFF;bottom:30px;opacity:0;animation:spark 2.4s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translateY(0) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-220px) rotate(180deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blk{border:1px solid #E6E8EC;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;transition:border-color .15s,transform .2s,box-shadow .2s;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.blk:hover{border-color:#CDD1D8;transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,17,21,.06)}
.lbl{font-size:12px;font-weight:500;color:#5F6573}

.page{max-width:none}
.search{display:flex;gap:8px;align-items:center;max-width:720px}
.idbox{flex:1;height:36px;display:flex;align-items:center;padding:0 12px;border:1px solid #E1E3E8;border-radius:6px;font:500 14px 'Geist Mono',monospace;transition:border-color .15s,box-shadow .15s}
.idbox.focus{border-color:#1F4FD1;box-shadow:0 0 0 3px rgba(31,79,209,.15)}
.caret{display:inline-block;width:1px;height:16px;background:#1F4FD1;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stage{perspective:1200px;position:relative;height:280px;display:grid;place-items:center}
.card{width:360px;height:224px;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(145deg,#FFFFFF,#EEF2FD);color:#0F1115;box-shadow:0 30px 60px rgba(0,0,0,.45);padding:22px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;animation:cin .6s cubic-bezier(.2,.8,.2,1) both;transition:transform .4s}
.card:hover{transform:rotateY(-8deg) rotateX(6deg)}
.card.dim{background:linear-gradient(145deg,#2A3044,#1A2033);color:#8A8F9C;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
@keyframes cin{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.scan{position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,rgba(126,156,255,.55),transparent);animation:scan 1.1s ease-in-out infinite}
.scan::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#7E9CFF;box-shadow:0 0 12px #7E9CFF}
@keyframes scan{from{top:-60px}to{top:224px}}
.stamp{position:absolute;right:18px;bottom:18px;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-weight:600;font-size:12px;animation:stamp .45s cubic-bezier(.3,1.6,.5,1) .15s both}
.stamp.ok{background:#0F7A4E;color:#FFFFFF}.stamp.no{background:#B42318;color:#FFFFFF}
@keyframes stamp{from{opacity:0;transform:scale(1.8) rotate(-12deg)}to{opacity:1;transform:rotate(-4deg)}}
.halo{position:absolute;left:50%;top:50%;width:360px;height:224px;margin:-112px 0 0 -180px;border-radius:14px;border:2px solid #2FA36B;opacity:0;animation:halo 1.4s ease-out .2s both}
@keyframes halo{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
.shake{animation:cin .6s both, shake .45s ease .1s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.below{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.blk:nth-child(1){animation-delay:.3s}.blk:nth-child(2){animation-delay:.4s}.blk:nth-child(3){animation-delay:.5s}
.fact{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F0F1F3}
.try{border:0;background:none;color:#1F4FD1;font:500 12px 'Geist',sans-serif;cursor:pointer;padding:0}
.try:hover{text-decoration:underline}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>

<link rel="stylesheet" href="looks.css">
<script>try{var L=new URLSearchParams(location.search).get("look")||(parent!==window&&parent.SBC_LOOK)||"";if(L)document.documentElement.classList.add("look-"+L)}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div class="app">
  <aside class="side">
    <div class="ws"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#1F4FD1"></path><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path></svg>SBC Capital</div>
    <div style="padding: 0 8px; display: flex; flex-direction: column"><span style="font-weight: 500">[Utility name]</span><span class="muted" style="font-size: 12px">Buyer account · Abu Dhabi</span></div>
    <nav class="nav" aria-label="Portal"><a href="bNeed.dc.html"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>Post a need</a><a href="bNeeds.dc.html"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Your needs<span class="ct">2</span></a><a href="bPack.dc.html"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM4 7l8 6 8-6"></path></svg>Introductions<span class="ct" style="color: #1F4FD1">2</span></a><a class="on" href="bCheck.dc.html"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM14 6h4v4h-4z"></path></svg>Check a mark</a></nav>
  </aside>
  <main class="main">
    <div class="top"><b>Check a mark</b><span class="muted" style="margin-left: auto">Live register · updated daily</span></div>
    <div class="page">
      <div style="display: flex; flex-direction: column; gap: 4px"><h1>Check a mark</h1><span class="muted">Enter the ID on a company's badge or pack. You see its live status.</span></div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div class="search"><span class="idbox {{focusCls}}">{{id}}<span class="caret"></span></span><button class="btn pri" style="height: 36px" onClick="{{check}}">Check</button></div>
        <span class="muted" style="font-size: 12px; display: flex; gap: 12px">Try <button class="try" onClick="{{tryOk}}">SBC-Q-2026-0142</button><button class="try" onClick="{{tryNo}}">SBC-Q-2025-0907</button></span>
      </div>

      <section class="hero" aria-label="Result">
        <div class="lat" aria-hidden="true"></div>
        <div class="copy" style="position: relative; display: flex; flex-direction: column; gap: 14px">
          <sc-for list="{{res}}" as="r" hint-placeholder-count="1">
            <div style="display: flex; flex-direction: column; gap: 14px">
              <span class="eyebrow">{{r.eyebrow}}</span>
              <h1 class="big">{{r.title}}</h1>
              <span class="lede">{{r.lede}}</span>
            </div>
          </sc-for>
        </div>
        <div class="stage" aria-hidden="true">
          <sc-if value="{{isOk}}" hint-placeholder-val="{{ false }}"><span class="halo"></span><span class="spark" style="left: 10%; animation-delay: .3s"></span><span class="spark" style="left: 24%; animation-delay: calc(.3s + .1s); width: 4px; height: 4px"></span><span class="spark" style="left: 40%; animation-delay: calc(.3s + .25s)"></span><span class="spark" style="left: 58%; animation-delay: calc(.3s + .15s); width: 5px; height: 5px"></span><span class="spark" style="left: 72%; animation-delay: calc(.3s + .3s)"></span><span class="spark" style="left: 88%; animation-delay: calc(.3s + .2s); width: 4px; height: 4px"></span></sc-if>
          <sc-for list="{{res}}" as="r" hint-placeholder-count="1">
            <div class="card {{r.cardCls}}">
              <div style="display: flex; justify-content: space-between; align-items: flex-start">
                <svg width="56" height="56" viewBox="0 0 96 96"><rect x="18" y="18" width="60" height="60" rx="3" fill="none" stroke="currentColor" stroke-width="6"></rect><rect x="60" y="20" width="16" height="16" fill="{{r.corner}}"></rect></svg>
                <span class="mono" style="font-size: 11px">{{r.id}}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 600; font-size: 20px; letter-spacing: -.01em">{{r.cardTitle}}</span>
                <span style="font-size: 14px">{{r.company}}</span>
                <span style="font-size: 12px; opacity: .7">{{r.cardSub}}</span>
              </div>
              <sc-if value="{{r.scanning}}" hint-placeholder-val="{{ false }}"><span class="scan"></span></sc-if>
              <sc-if value="{{r.stampOk}}" hint-placeholder-val="{{ false }}"><span class="stamp ok"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"><path d="M5 12l5 5 9-10"></path></svg>Valid</span></sc-if>
              <sc-if value="{{r.stampNo}}" hint-placeholder-val="{{ false }}"><span class="stamp no">Not active</span></sc-if>
            </div>
          </sc-for>
        </div>
      </section>

      <sc-if value="{{isOk}}" hint-placeholder-val="{{ false }}">
        <div class="below">
          <section class="blk" aria-label="Record"><span class="lbl">Record</span>
            <span class="fact"><span class="muted">Company</span><span>Brunnvik Water AS</span></span>
            <span class="fact"><span class="muted">Country</span><span>Norway</span></span>
            <span class="fact"><span class="muted">Qualified</span><span>2 Aug 2026</span></span>
            <span class="fact" style="border: 0"><span class="muted">Valid to</span><span>Aug 2027</span></span>
          </section>
          <section class="blk" aria-label="Last screening"><span class="lbl">Last screening</span><span style="font-size: 15px; font-weight: 500">Clear · 1 Oct 2026</span><span class="muted">Screening re-runs every month.</span></section>
          <section class="blk" aria-label="Next"><span class="lbl">Want to work with them?</span><span>Post a need and SBC can introduce you.</span><span><a class="btn" href="bNeed.dc.html">Post a need</a></span></section>
        </div>
      </sc-if>
    </div>
  </main>
</div>
</template>
<script>window.SBC_ACTIONS = {"all": {"Messages": {"toast": "Messages is not part of this prototype yet"}, "Open messages": {"toast": "Messages is not part of this prototype yet"}}, "screen": {}};</script>
<script src="dc-lite.js"></script>
<script>
DCLite.mount(document.getElementById('tpl'), function (DCLogic) {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { id: 'SBC-Q-2026-0142', phase: 'idle' }; this.t = []; }
componentWillUnmount() { this.t.forEach(clearTimeout); }
run(id) {
  this.t.forEach(clearTimeout); this.t = [];
  this.setState({ id, phase: 'scan' });
  this.t.push(setTimeout(() => this.setState({ phase: id.endsWith('0142') ? 'ok' : 'no' }), 1300));
}
renderVals() {
  const { id, phase } = this.state;
  const base = { id, corner: '#1F4FD1', cardCls: '', scanning: false, stampOk: false, stampNo: false };
  let r;
  if (phase === 'idle') r = { ...base, eyebrow: 'Live register', title: 'Is this mark real?', lede: 'Every SBC-Qualified company has a mark ID. Check it here before you rely on it.', cardTitle: 'SBC-Qualified', company: 'Company name', cardSub: 'Enter an ID to check', cardCls: 'dim', corner: '#3A4260' };
  else if (phase === 'scan') r = { ...base, eyebrow: 'Checking the register', title: 'Checking…', lede: 'Matching the ID against the live SBC register.', cardTitle: 'SBC-Qualified', company: 'Looking up', cardSub: 'SBC Capital · Dubai', scanning: true, cardCls: 'dim', corner: '#3A4260' };
  else if (phase === 'ok') r = { ...base, eyebrow: 'Checked just now', title: 'This mark is valid.', lede: 'Brunnvik Water AS passed all five checks, signed by two SBC officers.', cardTitle: 'SBC-Qualified', company: 'Brunnvik Water AS', cardSub: 'SBC Capital · Dubai · valid to Aug 2027', stampOk: true };
  else r = { ...base, eyebrow: 'Checked just now', title: 'This mark is not active.', lede: 'It expired on 4 Sep 2026. Ask the company for a current mark before you rely on it.', cardTitle: 'Expired', company: 'Mark not active', cardSub: 'SBC Capital · Dubai', stampNo: true, cardCls: 'dim shake', corner: '#B42318' };
  return { res: [r], isOk: phase === 'ok', focusCls: phase === 'idle' ? 'focus' : '',
    check: () => this.run(id), tryOk: () => this.run('SBC-Q-2026-0142'), tryNo: () => this.run('SBC-Q-2025-0907') };
}
}

return Component;
}, document.getElementById('root'));
</script>
</body>
</html>
