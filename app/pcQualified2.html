<!doctype html>
<html lang="en" class="role-company look-a" data-home="/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>SBC-Qualified, console look with night hero</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;font-size:13px;line-height:1.5;color:#0F1115;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#1F4FD1}a:hover{color:#163B9E}
.app{display:flex;min-height:900px;background:#FFFFFF}
.side{width:232px;flex:none;background:#FAFAFB;border-right:1px solid #E6E8EC;display:flex;flex-direction:column;gap:16px;padding:12px;box-sizing:border-box}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-weight:600;font-size:14px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:#3D4250;text-decoration:none;transition:background .15s}
.nav a:hover{background:#F1F2F4;color:#0F1115}
.nav a.on{background:#EBEDF0;color:#0F1115;font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ct{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:#8A8F9C}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;border-bottom:1px solid #E6E8EC;display:flex;align-items:center;gap:8px;padding:0 24px;color:#5F6573;box-sizing:border-box}
.top b{color:#0F1115;font-weight:500}
.page{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;color:#0F1115;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{background:#F7F8FA;color:#0F1115}.btn:active{transform:scale(.97)}
.btn.pri{background:#1F4FD1;border-color:#1F4FD1;color:#FFFFFF}.btn.pri:hover{box-shadow:0 0 0 3px rgba(31,79,209,.18);color:#FFFFFF}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;background:#F1F2F4;color:#3D4250;gap:4px;white-space:nowrap}
.ok{background:#E9F6EF;color:#0B6B47}
.mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:#8A8F9C}
.panel{border:1px solid #E6E8EC;border-radius:8px;background:#FFFFFF}
.ph{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-bottom:1px solid #E6E8EC;font-weight:500;box-sizing:border-box}

.hero{position:relative;overflow:hidden;border-radius:12px;background:radial-gradient(620px 340px at 72% 50%,rgba(31,79,209,.5),transparent 70%),#0E1220;color:#FFFFFF;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:center;padding:48px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.lat{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(115deg,transparent 49.6%,#7E9CFF 49.6%,#7E9CFF 50.4%,transparent 50.4%),linear-gradient(65deg,transparent 49.6%,#7E9CFF 49.6%,#7E9CFF 50.4%,transparent 50.4%);background-size:160px 120px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000);mask-image:linear-gradient(90deg,transparent 20%,#000)}
.eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9DB4FF}
.big{font-size:40px;font-weight:600;line-height:1.08;margin:0;letter-spacing:-.025em}
.hbtn{height:36px;padding:0 14px;border-radius:6px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#FFFFFF;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background .15s,transform .1s}
.hbtn:hover{background:rgba(255,255,255,.14)}.hbtn:active{transform:scale(.97)}
.hbtn.pri{background:#1F4FD1;border-color:#1F4FD1}.hbtn.pri:hover{background:#3D6AF0;box-shadow:0 0 0 3px rgba(126,156,255,.25)}
.stage{perspective:1200px;position:relative;height:280px;display:grid;place-items:center}
.card{width:360px;height:224px;position:relative;transform-style:preserve-3d;animation:flip 1.4s cubic-bezier(.2,.8,.2,1) .3s both;border-radius:12px}
.card:hover{animation:none;transform:rotateY(-8deg) rotateX(6deg);transition:transform .4s}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.front{background:linear-gradient(145deg,#FFFFFF,#EEF2FD);color:#0F1115;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 1px 0 #FFFFFF}
.front::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);background-size:250% 100%;background-position:120% 0;animation:sheen 1.2s ease 2.4s both;pointer-events:none}
.back{background:#1F4FD1;transform:rotateY(180deg)}
@keyframes flip{from{transform:rotateY(180deg) translateY(30px)}to{transform:rotateY(0) translateY(0)}}
@keyframes sheen{to{background-position:-120% 0}}
.sq{stroke-dasharray:240;stroke-dashoffset:240;animation:draw .8s ease-out 1.5s forwards}
.corner{transform-origin:68px 28px;transform:scale(0);animation:light .4s cubic-bezier(.3,1.6,.5,1) 2.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes light{to{transform:scale(1)}}
.spark{position:absolute;width:7px;height:7px;border-radius:1px;background:#7E9CFF;bottom:30px;opacity:0;animation:spark 2.4s ease-out 2.3s forwards}
.spark:nth-child(2){left:20%;animation-delay:2.35s;width:5px;height:5px}.spark:nth-child(3){left:35%;animation-delay:2.5s}.spark:nth-child(4){left:55%;animation-delay:2.4s;width:4px;height:4px}.spark:nth-child(5){left:70%;animation-delay:2.6s}.spark:nth-child(6){left:85%;animation-delay:2.45s;width:5px;height:5px}.spark:nth-child(7){left:45%;animation-delay:2.7s;width:4px;height:4px}
@keyframes spark{0%{opacity:0;transform:translateY(0) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-220px) rotate(180deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.copy>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.copy>*:nth-child(1){animation-delay:2.1s}.copy>*:nth-child(2){animation-delay:2.2s}.copy>*:nth-child(3){animation-delay:2.3s}.copy>*:nth-child(4){animation-delay:2.4s}
.keys{display:flex;gap:6px}
.key{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:999px;background:rgba(126,156,255,.14);color:#C9D5FF;font-size:12px;font-weight:500}
.below{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.blk{border:1px solid #E6E8EC;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;transition:border-color .15s,transform .2s,box-shadow .2s;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.blk:nth-child(1){animation-delay:2.6s}.blk:nth-child(2){animation-delay:2.7s}.blk:nth-child(3){animation-delay:2.8s}
.blk:hover{border-color:#CDD1D8;transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,17,21,.06)}
pre{margin:0;padding:10px;background:#0F1115;color:#E6E8EC;border-radius:6px;font:11px/1.6 "Geist Mono",monospace;overflow-x:auto}
.lbl{font-size:12px;font-weight:500;color:#5F6573}
.blk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.blk li{display:flex;gap:8px;align-items:flex-start}
.dot{width:16px;height:16px;border-radius:999px;display:grid;place-items:center;flex:none;margin-top:1px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}.sq{stroke-dashoffset:0}.corner{transform:none}}
</style>

<link rel="stylesheet" href="looks.css">
<script>try{var L=new URLSearchParams(location.search).get("look")||(parent!==window&&parent.SBC_LOOK)||"";if(L)document.documentElement.classList.add("look-"+L)}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div class="app">
  <aside class="side">
    <div class="ws"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#1F4FD1"></path><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path></svg>SBC Capital</div>
    <div style="padding: 0 8px; display: flex; flex-direction: column"><span style="font-weight: 500">Halvorsen Water Systems</span><span class="muted" style="font-size: 12px">Company account · Norway</span></div>
    <nav class="nav" aria-label="Portal"><a href="pcHome.dc.html"><svg viewBox="0 0 24 24"><path d="M4 12h4l3-7 3 14 3-7h3"></path></svg>Status</a><a href="pcChecklist.dc.html"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>Checklist</a><a href="cPlan.dc.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Action plan<span class="ct">2 left</span></a><a href="#"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"></path></svg>Messages</a><a href="cIntros.dc.html"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM4 7l8 6 8-6"></path></svg>Introductions<span class="ct" style="color: #1F4FD1">1</span></a><a class="on" href="pcQualified2.dc.html"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM14 6h4v4h-4z"></path></svg>Your mark</a></nav>
  </aside>

  <main class="main">
    <div class="top"><b>Your mark</b><span class="badge ok" style="margin-left: 8px">Active</span><span class="mono muted" style="margin-left: auto">SBC-Q-[ID]</span></div>
    <div class="page">
      <sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
        <section class="hero" aria-label="SBC-Qualified">
          <div class="lat" aria-hidden="true"></div>
          <div class="copy" style="position: relative; display: flex; flex-direction: column; gap: 14px">
            <span class="keys"><span class="key"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v3"></path></svg>Officer 1 signed</span><span class="key"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v3"></path></svg>Officer 2 signed</span></span>
            <h1 class="big">You are SBC-Qualified.</h1>
            <span style="font-size: 15px; color: #C9CDD6; max-width: 440px">SBC can now introduce you to Gulf buyers whose needs fit. Valid to 15 Oct 2027.</span>
            <span style="display: flex; gap: 8px; margin-top: 4px"><button class="hbtn pri">Share verification link</button><button class="hbtn">Download certificate</button><button class="hbtn" onClick="{{replay}}">Replay</button></span>
          </div>
          <div class="stage" aria-hidden="true">
            <span class="spark" style="left: 10%"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
            <div class="card">
              <div class="face front">
                <div style="display: flex; justify-content: space-between; align-items: flex-start">
                  <svg width="64" height="64" viewBox="0 0 96 96"><rect class="sq" x="18" y="18" width="60" height="60" rx="3" fill="none" stroke="#0F1115" stroke-width="6"></rect><rect class="corner" x="60" y="20" width="16" height="16" fill="#1F4FD1"></rect></svg>
                  <span class="mono" style="font-size: 11px; color: #5F6573">SBC-Q-[ID]</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 2px">
                  <span style="font-weight: 600; font-size: 20px; letter-spacing: -.01em">SBC-Qualified</span>
                  <span style="font-size: 14px">Halvorsen Water Systems</span>
                  <span style="font-size: 12px; color: #5F6573">SBC Capital · Dubai · valid to Oct 2027</span>
                </div>
              </div>
              <div class="face back"></div>
            </div>
          </div>
        </section>
      </sc-if>

      <div class="below">
        <section class="blk" aria-label="Badge"><span class="lbl">For your website</span><span style="font-size: 14px; font-weight: 500">Add the badge. Buyers click it to check you live.</span>
          <pre>&lt;a href="https://[verify-url]/SBC-Q-[ID]"&gt;
  &lt;img src="https://[badge-url]"&gt;
&lt;/a&gt;</pre>
          <span><button class="btn">Copy code</button></span></section>
        <section class="blk" aria-label="It means"><span class="lbl">It means</span><ul><li><span class="dot" style="background: #E9F6EF"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#0B6B47" stroke-width="4" stroke-linecap="round"><path d="M5 12l5 5 9-10"></path></svg></span><span>Identity and ownership reviewed</span></li><li><span class="dot" style="background: #E9F6EF"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#0B6B47" stroke-width="4" stroke-linecap="round"><path d="M5 12l5 5 9-10"></path></svg></span><span>Licences valid</span></li><li><span class="dot" style="background: #E9F6EF"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#0B6B47" stroke-width="4" stroke-linecap="round"><path d="M5 12l5 5 9-10"></path></svg></span><span>Screening clear, re-run monthly</span></li><li><span class="dot" style="background: #E9F6EF"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#0B6B47" stroke-width="4" stroke-linecap="round"><path d="M5 12l5 5 9-10"></path></svg></span><span>Gulf readiness assessed</span></li></ul><span class="muted" style="font-size: 12px; margin-top: auto">Reviewed by two SBC officers.</span></section>
        <section class="blk" aria-label="It does not mean"><span class="lbl">It does not mean</span><ul><li><span class="dot" style="background: #F1F2F4"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#5F6573" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></span><span>A licence or permit</span></li><li><span class="dot" style="background: #F1F2F4"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#5F6573" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></span><span>A promised contract</span></li><li><span class="dot" style="background: #F1F2F4"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#5F6573" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></span><span>An introduction to every opportunity</span></li></ul><span class="muted" style="font-size: 12px; margin-top: auto">Re-check in 12 months, AED 4,500 · working answer</span></section>
      </div>
    </div>
  </main>
</div>
</template>
<script>window.SBC_ACTIONS = {"all": {"Messages": {"toast": "Messages is not part of this prototype yet"}, "Open messages": {"toast": "Messages is not part of this prototype yet"}}, "screen": {"Share verification link": {"toast": "Verification link copied", "copy": "https://[verify-url]/SBC-Q-[ID]", "done": "Link copied"}, "Download certificate": {"toast": "Certificate downloaded as PDF (prototype)"}, "Copy code": {"toast": "Badge code copied", "copy": "<a href=\"https://[verify-url]/SBC-Q-[ID]\"><img src=\"https://[badge-url]\" alt=\"SBC-Qualified\"></a>", "done": "Copied"}}};</script>
<script src="dc-lite.js"></script>
<script>
DCLite.mount(document.getElementById('tpl'), function (DCLogic) {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { show: true }; }
componentWillUnmount() { clearTimeout(this.t); }
renderVals() {
  return { show: this.state.show, replay: () => { this.setState({ show: false }); this.t = setTimeout(() => this.setState({ show: true }), 60); } };
}
}

return Component;
}, document.getElementById('root'));
</script>
</body>
</html>
