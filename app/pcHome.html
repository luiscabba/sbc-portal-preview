<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;font-size:13px;line-height:1.5;color:#0F1115;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#1F4FD1}a:hover{color:#163B9E}
.app{display:flex;min-height:900px;background:#FFFFFF}
.side{width:232px;flex:none;background:#FAFAFB;border-right:1px solid #E6E8EC;display:flex;flex-direction:column;gap:16px;padding:12px;box-sizing:border-box}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-weight:600;font-size:14px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:#3D4250;text-decoration:none;transition:background .15s}
.nav a:hover{background:#F1F2F4;color:#0F1115}
.nav a.on{background:#EBEDF0;color:#0F1115;font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ct{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:#8A8F9C}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;border-bottom:1px solid #E6E8EC;display:flex;align-items:center;gap:8px;padding:0 24px;color:#5F6573;box-sizing:border-box}
.top b{color:#0F1115;font-weight:500}
.page{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;color:#0F1115;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{background:#F7F8FA;color:#0F1115}.btn:active{transform:scale(.97)}
.btn.pri{background:#1F4FD1;border-color:#1F4FD1;color:#FFFFFF}.btn.pri:hover{box-shadow:0 0 0 3px rgba(31,79,209,.18);color:#FFFFFF}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;background:#F1F2F4;color:#3D4250;gap:4px;white-space:nowrap}
.ok{background:#E9F6EF;color:#0B6B47}.warn{background:#FDF3DF;color:#8A5600}.info{background:#EEF2FD;color:#1F4FD1}
.mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:#8A8F9C}
.panel{border:1px solid #E6E8EC;border-radius:8px;background:#FFFFFF}
.ph{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-bottom:1px solid #E6E8EC;font-weight:500;box-sizing:border-box}
.rail{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:28px 24px 20px}
.track{position:absolute;left:calc(24px + 10%);right:calc(24px + 10%);top:39px;height:2px;background:#E6E8EC}
.fill{position:absolute;left:0;top:0;height:2px;background:#1F4FD1;width:50%;transform-origin:left;animation:fill 1.4s cubic-bezier(.2,.8,.2,1) .3s both}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.dotx{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;background:#FFFFFF;border:2px solid #E1E3E8;z-index:1;box-sizing:border-box}
.done .dotx{background:#1F4FD1;border-color:#1F4FD1;animation:popin .3s cubic-bezier(.2,.8,.2,1) both}
.done:nth-child(3) .dotx{animation-delay:.6s}
.now .dotx{border-color:#1F4FD1;animation:ring 1.8s ease-out 1.6s infinite}
.now .dotx::after{content:"";width:8px;height:8px;border-radius:999px;background:#1F4FD1}
.token{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-family:'Geist Mono',monospace;font-size:10px;background:#0F1115;color:#FFFFFF;border-radius:4px;padding:2px 6px;animation:drop .5s cubic-bezier(.2,.8,.2,1) 1.5s both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(31,79,209,.35)}100%{box-shadow:0 0 0 10px rgba(31,79,209,0)}}
@keyframes drop{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}
.msg{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #F0F1F3;transition:background .15s}.msg:hover{background:#FAFAFB}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
