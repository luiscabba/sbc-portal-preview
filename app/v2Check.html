<!doctype html>
<html lang="en" class="role-officer look-a" data-home="/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Check a file</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;font-size:13px;line-height:1.5;color:#0F1115;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#1F4FD1}a:hover{color:#163B9E}
.app{display:flex;min-height:900px;background:#FFFFFF}
.side{width:232px;flex:none;background:#FAFAFB;border-right:1px solid #E6E8EC;display:flex;flex-direction:column;gap:16px;padding:12px;box-sizing:border-box}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-weight:600;font-size:14px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:#3D4250;text-decoration:none}
.nav a:hover{background:#F1F2F4;color:#0F1115}
.nav a.on{background:#EBEDF0;color:#0F1115;font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ct{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:#8A8F9C}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;color:#3D4250}
.av{width:22px;height:22px;border-radius:999px;background:#0F1115;color:#FFFFFF;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;border-bottom:1px solid #E6E8EC;display:flex;align-items:center;gap:8px;padding:0 24px;color:#5F6573;box-sizing:border-box}
.top a{color:#5F6573;text-decoration:none}.top b{color:#0F1115;font-weight:500}
.page{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:14px;font-weight:600;margin:0}
.sub{color:#5F6573}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;color:#0F1115;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn:hover{background:#F7F8FA;color:#0F1115}
.btn.pri{background:#1F4FD1;border-color:#1F4FD1;color:#FFFFFF}
.btn.pri:hover{background:#1A45B8;color:#FFFFFF}
.btn:disabled{background:#F5F6F8;color:#A3A8B3;border-color:#E6E8EC;cursor:default}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;background:#F1F2F4;color:#3D4250;gap:4px;white-space:nowrap}
.ok{background:#E9F6EF;color:#0B6B47}.warn{background:#FDF3DF;color:#8A5600}.err{background:#FCEBEA;color:#A8231B}.info{background:#EEF2FD;color:#1F4FD1}
.mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:#8A8F9C}
.panel{border:1px solid #E6E8EC;border-radius:8px;background:#FFFFFF}
.ph{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-bottom:1px solid #E6E8EC;font-weight:500;box-sizing:border-box}
.row{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 12px;border-bottom:1px solid #F0F1F3;box-sizing:border-box}
.row:last-child{border-bottom:0}
.pick{width:100%;border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:6px}
.pick.on{background:#EEF2FD}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px 12px;padding:12px}
.kv span:nth-child(odd){color:#8A8F9C}
.glass{-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
@media (prefers-reduced-transparency: reduce){.glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:#FFFFFF !important}}
textarea{font:13px 'Geist',sans-serif;border:1px solid #E1E3E8;border-radius:6px;padding:8px 10px;resize:vertical}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,79,209,.35)}50%{box-shadow:0 0 0 4px rgba(31,79,209,0)}}
.page>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}.page>*:nth-child(4){animation-delay:.15s}.page>*:nth-child(5){animation-delay:.2s}
.col .card,.tbl .tr:not(.th),.panel .row,.panel .tr,.claim{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.col .card:nth-of-type(2),.tbl .tr:nth-child(3),.panel .tr:nth-child(3){animation-delay:.06s}
.col .card:nth-of-type(3),.tbl .tr:nth-child(4),.panel .tr:nth-child(4){animation-delay:.12s}
.tbl .tr:nth-child(5),.panel .tr:nth-child(5){animation-delay:.18s}.tbl .tr:nth-child(6),.panel .tr:nth-child(6){animation-delay:.24s}
.tbl .tr:nth-child(7){animation-delay:.3s}.tbl .tr:nth-child(8){animation-delay:.36s}.tbl .tr:nth-child(9){animation-delay:.42s}
.card{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,17,21,.08);border-color:#D5D8DF}
.btn{transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri:hover{box-shadow:0 0 0 3px rgba(31,79,209,.18)}
.card .btn.pri{animation:pulse 2.4s ease-in-out 1s 2}
.nav a{transition:background .15s,color .15s}
.nav a svg{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.nav a:hover svg{transform:translateX(2px)}
.tr,.row,.pick,.claim,.opt{transition:background .15s,border-color .15s}
a.tr:hover,.pick:hover,.claim:hover{background:#F7F8FA}
.pick.on,.claim.on{background:#EEF2FD}
.opt:hover{border-color:#B9C3E0}
.tabs button{transition:color .15s,border-color .2s}
.tabs button:hover{color:#0F1115}
.seg2 button{transition:background .15s,color .15s}
.badge{transition:background .2s,color .2s}
[role=dialog]{animation:pop .24s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}
.seg span,.meter span,.bar span{transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) .2s both}
.seg span:nth-child(2),.meter span:nth-child(2){animation-delay:.26s}.seg span:nth-child(3),.meter span:nth-child(3){animation-delay:.32s}.seg span:nth-child(4),.meter span:nth-child(4){animation-delay:.38s}.seg span:nth-child(5){animation-delay:.44s}
.node{transition:transform .18s,box-shadow .18s}.node:hover{transform:translateX(2px);box-shadow:0 2px 8px rgba(15,17,21,.06)}
.stat{transition:border-color .15s,transform .18s}.stat:hover{border-color:#D5D8DF;transform:translateY(-1px)}
.panel{transition:box-shadow .2s}
:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>

<link rel="stylesheet" href="looks.css">
<script>try{var L=new URLSearchParams(location.search).get("look")||(parent!==window&&parent.SBC_LOOK)||"";if(L)document.documentElement.classList.add("look-"+L)}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div class="app">
  <aside class="side">
    <div class="ws"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#1F4FD1"></path><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path></svg>SBC Capital</div>
    <nav class="nav" aria-label="Console">
      <a class="on" href="v2Board.dc.html"><svg viewBox="0 0 24 24"><path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"></path></svg>Board<span class="ct">7</span></a>
      <a href="v2Companies.dc.html"><svg viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15M9 21v-4h6v4M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"></path></svg>Companies</a>
      <a href="v2Buyers.dc.html"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5zM9 8V5h6v3"></path></svg>Buyers<span class="ct">3</span></a>
      <a href="v2Agents.dc.html"><svg viewBox="0 0 24 24"><path d="M16 20v-1a4 4 0 0 0-8 0v1M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"></path></svg>Agent panel</a>
      <a href="v2Audit.dc.html"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"></path></svg>Audit log</a>
    </nav>
    <div class="me"><span class="av">A</span>Officer A</div>
  </aside>

  <main class="main">
    <div class="top"><a href="v2Board.dc.html">Board</a><span>/</span><b>Halvorsen Water Systems</b></div>
    <div class="page">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
        <h1>Halvorsen Water Systems</h1>
        <span class="badge info">Step 1 · Check</span>
        <span class="badge mono">Day 2 of 3</span>
        <span style="margin-left: auto; display: flex; gap: 8px"><button class="btn">Ask company</button><button class="btn pri">Sign key 1</button></span>
      </div>

      <div style="display: grid; grid-template-columns: 260px minmax(0, 1fr) 280px; gap: 16px; align-items: start">
        <section class="panel" aria-label="Checks">
          <div class="ph">Checks<span class="ct">{{decided}}/5</span></div>
          <div style="padding: 4px">
            <sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
              <button class="pick row {{c.on}}" onClick="{{c.pick}}" style="border-bottom: 0">
                <span class="dot" style="background: {{c.dot}}; box-shadow: inset 0 0 0 1.5px {{c.dotEdge}}"></span>
                <span style="flex: 1">{{c.name}}</span>
                <span class="badge {{c.tone}}">{{c.status}}</span>
              </button>
            </sc-for>
          </div>
        </section>

        <section class="panel" aria-label="Check" style="position: relative">
          <div class="ph"><h2>{{cur.name}}</h2><span class="badge {{cur.tone}}">{{cur.status}}</span>
            <button class="btn" onClick="{{toggleAi}}" style="margin-left: auto; height: 26px; font-size: 12px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F4FD1" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"></path></svg>AI note</button>
          </div>
          <div style="display: flex; flex-direction: column">
            <div class="row" style="color: #8A8F9C; font-size: 12px; min-height: 32px; background: #FAFAFB"><span style="flex: 1">Document</span><span style="width: 90px">Page</span><span style="width: 110px">Result</span></div>
            <sc-for list="{{cur.docs}}" as="d" hint-placeholder-count="3">
              <a href="v2Evidence.dc.html" class="row" style="text-decoration: none; color: #0F1115">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8F9C" stroke-width="1.6" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5"></path></svg>
                <span style="flex: 1">{{d.name}}</span><span class="mono muted" style="width: 90px">{{d.page}}</span><span style="width: 110px"><span class="badge {{d.tone}}">{{d.state}}</span></span>
              </a>
            </sc-for>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-top: 1px solid #E6E8EC">
            <label for="note" class="muted" style="font-size: 12px">Note</label>
            <textarea id="note" rows="2" placeholder="Add a note to the file"></textarea>
            <div style="display: flex; gap: 8px"><button class="btn pri">Confirm</button><button class="btn">Ask company</button><button class="btn">Mark short</button></div>
          </div>

          <sc-if value="{{aiOpen}}" hint-placeholder-val="{{ true }}">
            <div class="glass" role="dialog" aria-label="AI note" style="position: absolute; top: 44px; right: 8px; width: 320px; border-radius: 10px; background: rgba(255,255,255,.78); border: 1px solid rgba(225,227,232,.9); box-shadow: 0 12px 32px rgba(15,17,21,.14); padding: 12px; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 600">AI note</span><span class="badge {{cur.confTone}}">{{cur.conf}}</span><button class="btn" onClick="{{toggleAi}}" aria-label="Close AI note" style="margin-left: auto; height: 22px; width: 22px; padding: 0; justify-content: center; border: 0">×</button></div>
              <span>{{cur.ai}}</span>
              <span class="mono muted" style="font-size: 11px">Model v[x] · 14 Oct 16:18 · you decide</span>
            </div>
          </sc-if>
        </section>

        <section class="panel" aria-label="File details">
          <div class="ph">Details</div>
          <div class="kv">
            <span>Country</span><span>Germany</span>
            <span>Sector</span><span>Water and utilities</span>
            <span>Markets</span><span>UAE, Saudi Arabia</span>
            <span>Version</span><span class="mono">v3 · locked</span>
            <span>Key 1</span><span>You · not signed</span>
            <span>Key 2</span><span class="muted">Another officer</span>
          </div>
          <div style="border-top: 1px solid #E6E8EC; padding: 12px; display: flex; flex-direction: column; gap: 8px">
            <span class="muted" style="font-size: 12px">Activity</span>
            <span>You confirmed Identity <span class="mono muted" style="font-size: 11px">09:12</span></span>
            <span>Company uploaded 2 docs <span class="mono muted" style="font-size: 11px">Tue</span></span>
            <span>AI prepared 5 checks <span class="mono muted" style="font-size: 11px">Tue</span></span>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
</template>
<script>window.SBC_ACTIONS = {"all": {"Messages": {"toast": "Messages is not part of this prototype yet"}, "Open messages": {"toast": "Messages is not part of this prototype yet"}}, "screen": {"Ask company": {"toast": "Request sent. It shows in the company's checklist", "done": "Asked"}, "Sign key 1": {"toast": "Key 1 signed. Sent to a second officer", "go": "v2Sign"}, "Confirm": {"toast": "Check confirmed", "done": "Confirmed"}, "Mark short": {"toast": "Marked short. Added to the action plan", "go": "v2Plan"}}};</script>
<script src="dc-lite.js"></script>
<script>
DCLite.mount(document.getElementById('tpl'), function (DCLogic) {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 1, ai: true }; }
renderVals() {
  const list = [
    { name: 'Identity', status: 'Confirmed', tone: 'ok', conf: 'High', ai: 'Registered in Hamburg and active. Name matches the trade licence.',
      docs: [['Register extract', 'p.1', 'Matches', 'ok'], ['Trade licence', 'p.1', 'Matches', 'ok']] },
    { name: 'Ownership', status: 'Open', tone: 'warn', conf: 'Check', ai: 'Two final owners. The Cyprus holding company has no official register extract yet.',
      docs: [['Shareholder register', 'p.2', 'Matches', 'ok'], ['Holding company extract', 'p.1', 'Matches', 'ok'], ['Ownership chart', 'p.1', 'Not official', 'warn'], ['Cyprus register extract', '·', 'Missing', 'err']] },
    { name: 'Licences', status: 'Confirmed', tone: 'ok', conf: 'High', ai: 'Five documents, all current. ISO 9001 expires Feb 2027.',
      docs: [['Trade licence', 'p.1', 'Valid', 'ok'], ['ISO 9001', 'p.1', 'To Feb 2027', 'ok']] },
    { name: 'Screening', status: 'Open', tone: 'warn', conf: 'Check', ai: 'No sanctions or PEP match. One media article, likely a different Halvorsen in Norway.',
      docs: [['Sanctions and PEP run', '·', 'Clear', 'ok'], ['Media article', '·', 'Rule out', 'warn']] },
    { name: 'Readiness', status: 'Short', tone: '', conf: 'High', ai: 'No ICV certificate and no UAE agent. Action plan drafted with two agents from the panel.',
      docs: [['ICV certificate', '·', 'Missing', 'err'], ['Agent agreement', '·', 'Missing', 'err']] }
  ];
  const dot = { ok: '#0F1115', warn: '#E0A030', '': '#0F1115' };
  const sel = this.state.sel;
  const checks = list.map((c, i) => ({ name: c.name, status: c.status, tone: c.tone, on: i === sel ? 'on' : '',
    dot: dot[c.tone], dotEdge: dot[c.tone], pick: () => this.setState({ sel: i }) }));
  const c = list[sel];
  const cur = { name: c.name, status: c.status, tone: c.tone, ai: c.ai, conf: c.conf, confTone: c.conf === 'High' ? 'ok' : 'warn',
    docs: c.docs.map(([name, page, state, tone]) => ({ name, page, state, tone })) };
  return { checks, cur, decided: list.filter((x) => x.status !== 'Open').length, aiOpen: this.state.ai,
    toggleAi: () => this.setState({ ai: !this.state.ai }) };
}
}

return Component;
}, document.getElementById('root'));
</script>
</body>
</html>
