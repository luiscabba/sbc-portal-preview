/* motion */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,79,209,.35)}50%{box-shadow:0 0 0 4px rgba(31,79,209,0)}}
.page>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}.page>*:nth-child(4){animation-delay:.15s}.page>*:nth-child(5){animation-delay:.2s}
.col .card,.tbl .tr:not(.th),.panel .row,.panel .tr,.claim{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.col .card:nth-of-type(2),.tbl .tr:nth-child(3),.panel .tr:nth-child(3){animation-delay:.06s}
.col .card:nth-of-type(3),.tbl .tr:nth-child(4),.panel .tr:nth-child(4){animation-delay:.12s}
.tbl .tr:nth-child(5),.panel .tr:nth-child(5){animation-delay:.18s}.tbl .tr:nth-child(6),.panel .tr:nth-child(6){animation-delay:.24s}
.tbl .tr:nth-child(7){animation-delay:.3s}.tbl .tr:nth-child(8){animation-delay:.36s}.tbl .tr:nth-child(9){animation-delay:.42s}
.card{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,17,21,.08);border-color:#D5D8DF}
.btn{transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri:hover{box-shadow:0 0 0 3px rgba(31,79,209,.18)}
.card .btn.pri{animation:pulse 2.4s ease-in-out 1s 2}
.nav a{transition:background .15s,color .15s}
.nav a svg{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.nav a:hover svg{transform:translateX(2px)}
.tr,.row,.pick,.claim,.opt{transition:background .15s,border-color .15s}
a.tr:hover,.pick:hover,.claim:hover{background:#F7F8FA}
.pick.on,.claim.on{background:#EEF2FD}
.opt:hover{border-color:#B9C3E0}
.tabs button{transition:color .15s,border-color .2s}
.tabs button:hover{color:#0F1115}
.seg2 button{transition:background .15s,color .15s}
.badge{transition:background .2s,color .2s}
[role=dialog]{animation:pop .24s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}
.seg span,.meter span,.bar span{transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) .2s both}
.seg span:nth-child(2),.meter span:nth-child(2){animation-delay:.26s}.seg span:nth-child(3),.meter span:nth-child(3){animation-delay:.32s}.seg span:nth-child(4),.meter span:nth-child(4){animation-delay:.38s}.seg span:nth-child(5){animation-delay:.44s}
.node{transition:transform .18s,box-shadow .18s}.node:hover{transform:translateX(2px);box-shadow:0 2px 8px rgba(15,17,21,.06)}
.stat{transition:border-color .15s,transform .18s}.stat:hover{border-color:#D5D8DF;transform:translateY(-1px)}
.panel{transition:box-shadow .2s}
:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

<body>
<div id="root"></div>
<template id="tpl">
<div class="app">
  <aside class="side">
    <div class="ws"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#1F4FD1"></path><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path></svg>SBC Capital</div>
    <nav class="nav" aria-label="Console">
      <a class="on" href="v2Board.dc.html"><svg viewBox="0 0 24 24"><path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"></path></svg>Board<span class="ct">7</span></a>
      <a href="v2Companies.dc.html"><svg viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15M9 21v-4h6v4M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"></path></svg>Companies</a>
      <a href="v2Buyers.dc.html"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5zM9 8V5h6v3"></path></svg>Buyers<span class="ct">3</span></a>
      <a href="v2Agents.dc.html"><svg viewBox="0 0 24 24"><path d="M16 20v-1a4 4 0 0 0-8 0v1M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"></path></svg>Agent panel</a>
      <a href="v2Audit.dc.html"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"></path></svg>Audit log</a>
    </nav>
    <div class="me"><span class="av">A</span>Officer A</div>
  </aside>
  <main class="main">

    <div class="top"><b>Board</b></div>
    <div class="page">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
        <h1>Board</h1>
        <span class="sub">AI reads uploads first. You decide.</span>
        <span style="margin-left: auto; display: flex; gap: 8px"><button class="btn">Mine</button><button class="btn">Filter</button></span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div class="groups">
          <span class="g todo">Your move <span class="badge info mono">7</span></span>
          <span class="g">Company's move <span class="badge mono">2</span></span>
          <span class="g">Done <span class="badge mono">3</span><span class="muted" style="margin-left: auto; font-weight: 400">This week</span></span>
        </div>

        <div class="cols">
          <sc-for list="{{steps}}" as="col" hint-placeholder-count="3">
            <section class="col">
              <div class="ch"><span class="step">{{col.step}}</span>{{col.title}}<span class="ct">{{col.count}}</span></div>
              <div class="colgoal">{{col.goal}}</div>
              <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
                <div class="card {{c.cls}}">
                  <div class="ct1"><span class="nm">{{c.name}}</span><span class="mono {{c.dayCls}}" style="font-size: 11px">{{c.days}}</span></div>
                  <div class="seg"><sc-for list="{{c.segs}}" as="s" hint-placeholder-count="5"><span style="background: {{s.bg}}; box-shadow: inset 0 0 0 1px {{s.edge}}"></span></sc-for></div>
                  <div class="foot"><span class="badge {{c.tone}}">{{c.note}}</span><a class="btn sm {{c.btnCls}}" href="{{c.href}}">{{c.action}}</a></div>
                </div>
              </sc-for>
            </section>
          </sc-for>

          <section class="col" style="background: transparent; border: 1px dashed #D5D8DF">
            <div class="ch">Uploading<span class="ct">2</span></div>
            <div class="colgoal">Waiting on the company</div>
            <sc-for list="{{waiting}}" as="c" hint-placeholder-count="2">
              <div class="card wait">
                <div class="ct1"><span class="nm">{{c.name}}</span><span class="mono muted" style="font-size: 11px">{{c.days}}</span></div>
                <div style="display: flex; align-items: center; gap: 8px"><div class="bar"><span style="width: {{c.pct}}"></span></div><span class="mono muted" style="font-size: 11px">{{c.progress}}</span></div>
                <div class="foot"><span class="muted" style="font-size: 12px">{{c.what}}</span><button class="btn sm">Remind</button></div>
              </div>
            </sc-for>
          </section>

          <section class="col">
            <div class="ch">Decided<span class="ct">3</span></div>
            <div class="colgoal">Signed</div>
            <sc-for list="{{done}}" as="c" hint-placeholder-count="3">
              <a href="v2Company.dc.html" class="card" style="text-decoration: none; color: #0F1115">
                <div class="ct1"><span class="nm">{{c.name}}</span><span class="mono muted" style="font-size: 11px">{{c.day}}</span></div>
                <span><span class="badge {{c.tone}}">{{c.outcome}}</span></span>
              </a>
            </sc-for>
          </section>
        </div>
      </div>

    </div>
  </main>
</div>
</template>

<script>
DCLite.mount(document.getElementById('tpl'), function (DCLogic) {
class Component extends DCLogic {
renderVals() {
  const C = { k: '#0F1115', y: '#E0A030', r: '#D33A2F', o: 'transparent' };
  const segs = (s) => s.split('').map((ch) => ({ bg: C[ch], edge: ch === 'o' ? '#CDD1D8' : C[ch] }));
  const card = (name, s, ask, note, tone, days, action, href, o) => {
    o = o || {};
    return { name, segs: segs(s), ask, note, tone, days, action, href, cls: o.late ? 'late' : '', dayCls: o.late ? '' : 'muted', btnCls: o.primary ? 'pri' : '' };
  };
