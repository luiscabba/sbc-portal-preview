<!doctype html>
<html lang="en" class="role-company look-a" data-home="/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Introductions received, console look with delight</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;font-size:13px;line-height:1.5;color:#0F1115;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#1F4FD1}
.app{display:flex;min-height:900px;background:#FFFFFF}
.side{width:232px;flex:none;background:#FAFAFB;border-right:1px solid #E6E8EC;display:flex;flex-direction:column;gap:16px;padding:12px;box-sizing:border-box}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-weight:600;font-size:14px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:#3D4250;text-decoration:none;transition:background .15s}
.nav a:hover{background:#F1F2F4;color:#0F1115}
.nav a.on{background:#EBEDF0;color:#0F1115;font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ct{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:#8A8F9C}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;border-bottom:1px solid #E6E8EC;display:flex;align-items:center;gap:8px;padding:0 24px;color:#5F6573;box-sizing:border-box}
.top b{color:#0F1115;font-weight:500}
.page{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px;max-width:760px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;color:#0F1115;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{background:#F7F8FA;color:#0F1115}.btn:active{transform:scale(.97)}
.btn.pri{background:#1F4FD1;border-color:#1F4FD1;color:#FFFFFF}.btn.pri:hover{box-shadow:0 0 0 3px rgba(31,79,209,.18);color:#FFFFFF}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;background:#F1F2F4;color:#3D4250;gap:4px;white-space:nowrap}
.ok{background:#E9F6EF;color:#0B6B47}.info{background:#EEF2FD;color:#1F4FD1}
.mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:#8A8F9C}
.panel{border:1px solid #E6E8EC;border-radius:8px;background:#FFFFFF}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;color:#3D4250}
input,textarea{font:13px 'Geist',sans-serif;border:1px solid #E1E3E8;border-radius:6px;padding:7px 10px;transition:border-color .15s,box-shadow .15s;box-sizing:border-box;width:100%}
input:focus,textarea:focus{outline:none;border-color:#1F4FD1;box-shadow:0 0 0 3px rgba(31,79,209,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 10px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;font:500 12px 'Geist',sans-serif;color:#3D4250;cursor:pointer;transition:all .15s}
.chip.on{background:#0F1115;border-color:#0F1115;color:#FFFFFF}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.hero{position:relative;overflow:hidden;border-radius:12px;background:radial-gradient(620px 340px at 72% 50%,rgba(31,79,209,.5),transparent 70%),#0E1220;color:#FFFFFF;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:center;padding:44px 48px;min-height:340px;box-sizing:border-box}
.lat{position:absolute;inset:0;opacity:.14;pointer-events:none;background-image:linear-gradient(115deg,transparent 49.6%,#7E9CFF 49.6%,#7E9CFF 50.4%,transparent 50.4%),linear-gradient(65deg,transparent 49.6%,#7E9CFF 49.6%,#7E9CFF 50.4%,transparent 50.4%);background-size:160px 120px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000);mask-image:linear-gradient(90deg,transparent 20%,#000)}
.eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9DB4FF}
.big{font-size:38px;font-weight:600;line-height:1.08;margin:0;letter-spacing:-.025em}
.lede{font-size:15px;color:#C9CDD6;max-width:440px}
.hbtn{height:36px;padding:0 14px;border-radius:6px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#FFFFFF;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background .15s,transform .1s}
.hbtn:hover{background:rgba(255,255,255,.14)}.hbtn:active{transform:scale(.97)}
.hbtn.pri{background:#1F4FD1;border-color:#1F4FD1}.hbtn.pri:hover{background:#3D6AF0;box-shadow:0 0 0 3px rgba(126,156,255,.25)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:rgba(126,156,255,.14);color:#C9D5FF;font-size:12px;font-weight:500}
.seg{display:inline-flex;padding:3px;border-radius:8px;background:rgba(255,255,255,.08);gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:6px;border:0;background:transparent;color:#C9CDD6;font:500 12px 'Geist',sans-serif;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:#FFFFFF}.seg button.on{background:#FFFFFF;color:#0E1220}
.copy>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.copy>*:nth-child(2){animation-delay:.08s}.copy>*:nth-child(3){animation-delay:.16s}.copy>*:nth-child(4){animation-delay:.24s}.copy>*:nth-child(5){animation-delay:.32s}
.spark{position:absolute;width:6px;height:6px;border-radius:1px;background:#7E9CFF;bottom:30px;opacity:0;animation:spark 2.4s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translateY(0) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-220px) rotate(180deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blk{border:1px solid #E6E8EC;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;transition:border-color .15s,transform .2s,box-shadow .2s;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.blk:hover{border-color:#CDD1D8;transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,17,21,.06)}
.lbl{font-size:12px;font-weight:500;color:#5F6573}

.page{max-width:1160px}
.hero.meet{grid-template-columns:minmax(0,1fr) 480px}
.link{position:relative;height:240px}
.node{position:absolute;top:70px;width:150px;height:100px;border-radius:10px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.node.a{left:0;background:linear-gradient(145deg,#FFFFFF,#EEF2FD);color:#0F1115;animation-delay:.2s;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.node.b{right:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#FFFFFF;animation-delay:.35s}
.mid{position:absolute;left:50%;top:96px;width:48px;height:48px;margin-left:-24px;display:grid;place-items:center;border-radius:12px;background:#0E1220;border:1px solid rgba(126,156,255,.4);animation:rise .5s ease .5s both;z-index:2}
.wire{position:absolute;left:150px;right:150px;top:120px;height:2px}
.wire svg{position:absolute;inset:-6px 0;width:100%;height:14px;overflow:visible}
.wire .dl{stroke:#7E9CFF;stroke-width:2;stroke-dasharray:4 6;fill:none;opacity:0;animation:fade .3s ease .7s forwards}
.wire .sl{stroke:#2FA36B;stroke-width:3;fill:none;stroke-dasharray:200;stroke-dashoffset:200;animation:sl .7s ease-out forwards}
@keyframes sl{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.pulse{position:absolute;top:-4px;width:10px;height:10px;border-radius:999px;background:#FFFFFF;box-shadow:0 0 14px #7E9CFF;animation:travel 1.8s ease-in-out 1s infinite;opacity:0}
@keyframes travel{0%{left:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:calc(100% - 10px);opacity:0}}
.hs{position:absolute;left:50%;top:180px;transform:translateX(-50%);white-space:nowrap;animation:rise .4s ease .6s both}
.below{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
.blk:nth-child(1){animation-delay:.9s}.blk:nth-child(2){animation-delay:1s}.blk:nth-child(3){animation-delay:1.1s}
.fact{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F0F1F3}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}.wire .dl{opacity:1}.wire .sl{stroke-dashoffset:0}}
</style>

<link rel="stylesheet" href="looks.css">
<script>try{var L=new URLSearchParams(location.search).get("look")||(parent!==window&&parent.SBC_LOOK)||"";if(L)document.documentElement.classList.add("look-"+L)}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div class="app">
  <aside class="side">
    <div class="ws"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#1F4FD1"></path><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path></svg>SBC Capital</div>
    <div style="padding: 0 8px; display: flex; flex-direction: column"><span style="font-weight: 500">Halvorsen Water Systems</span><span class="muted" style="font-size: 12px">Company account · Norway</span></div>
    <nav class="nav" aria-label="Portal"><a href="pcHome.dc.html"><svg viewBox="0 0 24 24"><path d="M4 12h4l3-7 3 14 3-7h3"></path></svg>Status</a><a href="pcChecklist.dc.html"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>Checklist</a><a href="cPlan.dc.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Action plan<span class="ct">2 left</span></a><a href="#"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"></path></svg>Messages</a><a class="on" href="cIntros.dc.html"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM4 7l8 6 8-6"></path></svg>Introductions<span class="ct" style="color: #1F4FD1">1</span></a><a href="pcQualified2.dc.html"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM14 6h4v4h-4z"></path></svg>Your mark</a></nav>
  </aside>
  <main class="main">
    <div class="top"><b>Introductions</b><span class="muted">/ OPP-0078</span><span class="badge {{topTone}}" style="margin-left: auto">{{topTag}}</span></div>
    <div class="page">
      <sc-for list="{{view}}" as="v" hint-placeholder-count="1">
        <div style="display: flex; flex-direction: column; gap: 16px">
          <section class="hero meet" aria-label="Introduction">
            <div class="lat" aria-hidden="true"></div>
            <div class="copy" style="position: relative; display: flex; flex-direction: column; gap: 14px">
              <span class="eyebrow">{{v.eyebrow}}</span>
              <h1 class="big">{{v.title}}</h1>
              <span class="lede">{{v.lede}}</span>
              <sc-if value="{{v.open}}" hint-placeholder-val="{{ true }}"><span style="display: flex; gap: 8px; margin-top: 4px"><button class="hbtn pri" onClick="{{v.accept}}">Accept introduction</button><button class="hbtn">Decline</button></span></sc-if>
              <sc-if value="{{v.yes}}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 8px; margin-top: 4px"><button class="hbtn pri">Open messages</button><button class="hbtn" onClick="{{v.reset}}">Replay</button></span></sc-if>
            </div>
            <div class="link" aria-hidden="true">
              <sc-if value="{{v.yes}}" hint-placeholder-val="{{ false }}"><span class="spark" style="left: 10%; animation-delay: .4s"></span><span class="spark" style="left: 24%; animation-delay: calc(.4s + .1s); width: 4px; height: 4px"></span><span class="spark" style="left: 40%; animation-delay: calc(.4s + .25s)"></span><span class="spark" style="left: 58%; animation-delay: calc(.4s + .15s); width: 5px; height: 5px"></span><span class="spark" style="left: 72%; animation-delay: calc(.4s + .3s)"></span><span class="spark" style="left: 88%; animation-delay: calc(.4s + .2s); width: 4px; height: 4px"></span></sc-if>
              <div class="node a"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="#0F1115" stroke-width="2"></rect><rect x="13" y="5" width="6" height="6" fill="#1F4FD1"></rect></svg><span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 12px">Halvorsen Water</span><span style="font-size: 11px; color: #5F6573">You · SBC-Qualified</span></span></div>
              <div class="wire"><svg viewBox="0 0 100 2" preserveAspectRatio="none"><line class="dl" x1="0" y1="1" x2="100" y2="1"></line><sc-if value="{{v.yes}}" hint-placeholder-val="{{ false }}"><line class="sl" x1="0" y1="1" x2="100" y2="1" pathLength="200"></line></sc-if></svg><sc-if value="{{v.open}}" hint-placeholder-val="{{ true }}"><span class="pulse"></span></sc-if></div>
              <div class="mid"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#1F4FD1"></path><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path></svg></div>
              <div class="node b"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9D5FF" stroke-width="1.8"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"></path></svg><span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 12px">[Utility name]</span><span style="font-size: 11px; color: #A9AFBA">Buyer · Abu Dhabi</span></span></div>
              <span class="hs pill">{{v.wireLabel}}</span>
            </div>
          </section>
          <div class="below">
            <section class="blk" aria-label="The need"><span class="lbl">The need</span>
              <span style="font-size: 15px; font-weight: 500">Desalination plant maintenance, 3 years</span>
              <span class="fact"><span class="muted">Lots</span><span>1 and 2</span></span>
              <span class="fact"><span class="muted">Where</span><span>Abu Dhabi</span></span>
              <span class="fact" style="border: 0"><span class="muted">Closes</span><span>[date]</span></span>
            </section>
            <section class="blk" aria-label="Why you"><span class="lbl">Why SBC matched you</span><span>Reverse osmosis maintenance is your core service. Three Gulf desalination contracts since 2021.</span></section>
            <section class="blk" aria-label="What they see"><span class="lbl">What the buyer sees</span><span>Your five checks, your mark and this match note. Nothing else from your file.</span></section>
          </div>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</template>
<script>window.SBC_ROLES = {"v2Login": "officer", "cRegister": "company", "v2Board": "officer", "v2Company": "officer", "pcHome": "company", "pcChecklist": "company", "v2Check": "officer", "v2Evidence": "officer", "v2Plan": "officer", "cPlan": "company", "v2Sign": "officer", "pcQualified2": "company", "bNeed": "buyer", "bNeeds": "buyer", "v2Buyers": "officer", "v2Need": "officer", "v2Introduce": "officer", "cIntros": "company", "bPack": "buyer", "bCheck": "buyer", "v2Companies": "officer", "v2Agents": "officer", "v2Audit": "officer"}; window.SBC_ACTIONS = {"all": {"Messages": {"toast": "Messages is not part of this prototype yet"}, "Open messages": {"toast": "Messages is not part of this prototype yet"}}, "screen": {"Decline": {"toast": "Introduction declined. SBC lets the buyer know", "done": "Declined"}}};</script>
<script src="dc-lite.js"></script>
<script>
DCLite.mount(document.getElementById('tpl'), function (DCLogic) {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { yes: false }; }
renderVals() {
  const yes = this.state.yes;
  const v = yes
    ? { eyebrow: 'Accepted just now', title: 'You are connected.', lede: 'SBC will propose meeting times to both sides within [x] working days.', wireLabel: 'Connected through SBC', open: false, yes: true }
    : { eyebrow: 'New · approved by an SBC officer today', title: 'A buyer wants to meet you.', lede: 'An Abu Dhabi utility needs desalination plant maintenance. SBC thinks you fit.', wireLabel: 'Introduced by SBC', open: true, yes: false };
  v.accept = () => this.setState({ yes: true }); v.reset = () => this.setState({ yes: false });
  return { view: [v], topTag: yes ? 'Accepted' : 'New', topTone: yes ? 'ok' : 'info',
    accept: () => this.setState({ yes: true }), reset: () => this.setState({ yes: false }) };
}
}

return Component;
}, document.getElementById('root'));
</script>
</body>
</html>
