<!doctype html>
<html lang="en" class="role-officer look-a" data-home="/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Second check</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;font-size:13px;line-height:1.5;color:#0F1115;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#1F4FD1}a:hover{color:#163B9E}
.app{display:flex;min-height:900px;background:#FFFFFF}
.side{width:232px;flex:none;background:#FAFAFB;border-right:1px solid #E6E8EC;display:flex;flex-direction:column;gap:16px;padding:12px;box-sizing:border-box}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-weight:600;font-size:14px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:#3D4250;text-decoration:none}
.nav a:hover{background:#F1F2F4;color:#0F1115}
.nav a.on{background:#EBEDF0;color:#0F1115;font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ct{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:#8A8F9C}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;color:#3D4250}
.av{width:22px;height:22px;border-radius:999px;background:#0F1115;color:#FFFFFF;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;border-bottom:1px solid #E6E8EC;display:flex;align-items:center;gap:8px;padding:0 24px;color:#5F6573;box-sizing:border-box}
.top a{color:#5F6573;text-decoration:none}.top b{color:#0F1115;font-weight:500}
.page{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;color:#0F1115;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn:hover{background:#F7F8FA;color:#0F1115}
.btn.pri{background:#1F4FD1;border-color:#1F4FD1;color:#FFFFFF}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;background:#F1F2F4;color:#3D4250;gap:4px;white-space:nowrap}
.ok{background:#E9F6EF;color:#0B6B47}.warn{background:#FDF3DF;color:#8A5600}.err{background:#FCEBEA;color:#A8231B}.info{background:#EEF2FD;color:#1F4FD1}
.mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:#8A8F9C}
.panel{border:1px solid #E6E8EC;border-radius:8px;background:#FFFFFF}
.ph{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-bottom:1px solid #E6E8EC;font-weight:500;box-sizing:border-box}
.row{display:grid;grid-template-columns:140px minmax(0,1fr) 168px;gap:12px;align-items:center;min-height:40px;padding:0 12px;border-bottom:1px solid #F0F1F3}
.row:last-child{border-bottom:0}
.seg2{display:inline-flex;border:1px solid #E1E3E8;border-radius:6px;overflow:hidden}
.seg2 button{height:26px;padding:0 10px;border:0;background:#FFFFFF;font:500 12px 'Geist',sans-serif;color:#3D4250;cursor:pointer}
.seg2 button.on{background:#0F1115;color:#FFFFFF}
.opt{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid #E1E3E8;border-radius:6px;background:#FFFFFF;font:inherit;color:inherit;cursor:pointer;text-align:left}
.opt.on{border-color:#1F4FD1;background:#EEF2FD}
.radio{width:14px;height:14px;border-radius:999px;border:1.5px solid #8A8F9C;display:grid;place-items:center;flex:none}
.opt.on .radio{border-color:#1F4FD1}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,79,209,.35)}50%{box-shadow:0 0 0 4px rgba(31,79,209,0)}}
.page>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}.page>*:nth-child(4){animation-delay:.15s}.page>*:nth-child(5){animation-delay:.2s}
.col .card,.tbl .tr:not(.th),.panel .row,.panel .tr,.claim{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.col .card:nth-of-type(2),.tbl .tr:nth-child(3),.panel .tr:nth-child(3){animation-delay:.06s}
.col .card:nth-of-type(3),.tbl .tr:nth-child(4),.panel .tr:nth-child(4){animation-delay:.12s}
.tbl .tr:nth-child(5),.panel .tr:nth-child(5){animation-delay:.18s}.tbl .tr:nth-child(6),.panel .tr:nth-child(6){animation-delay:.24s}
.tbl .tr:nth-child(7){animation-delay:.3s}.tbl .tr:nth-child(8){animation-delay:.36s}.tbl .tr:nth-child(9){animation-delay:.42s}
.card{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,17,21,.08);border-color:#D5D8DF}
.btn{transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri:hover{box-shadow:0 0 0 3px rgba(31,79,209,.18)}
.card .btn.pri{animation:pulse 2.4s ease-in-out 1s 2}
.nav a{transition:background .15s,color .15s}
.nav a svg{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.nav a:hover svg{transform:translateX(2px)}
.tr,.row,.pick,.claim,.opt{transition:background .15s,border-color .15s}
a.tr:hover,.pick:hover,.claim:hover{background:#F7F8FA}
.pick.on,.claim.on{background:#EEF2FD}
.opt:hover{border-color:#B9C3E0}
.tabs button{transition:color .15s,border-color .2s}
.tabs button:hover{color:#0F1115}
.seg2 button{transition:background .15s,color .15s}
.badge{transition:background .2s,color .2s}
[role=dialog]{animation:pop .24s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}
.seg span,.meter span,.bar span{transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) .2s both}
.seg span:nth-child(2),.meter span:nth-child(2){animation-delay:.26s}.seg span:nth-child(3),.meter span:nth-child(3){animation-delay:.32s}.seg span:nth-child(4),.meter span:nth-child(4){animation-delay:.38s}.seg span:nth-child(5){animation-delay:.44s}
.node{transition:transform .18s,box-shadow .18s}.node:hover{transform:translateX(2px);box-shadow:0 2px 8px rgba(15,17,21,.06)}
.stat{transition:border-color .15s,transform .18s}.stat:hover{border-color:#D5D8DF;transform:translateY(-1px)}
.panel{transition:box-shadow .2s}
:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>

<link rel="stylesheet" href="looks.css">
<script>try{var L=new URLSearchParams(location.search).get("look")||(parent!==window&&parent.SBC_LOOK)||"";if(L)document.documentElement.classList.add("look-"+L)}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div class="app">
  <aside class="side">
    <div class="ws"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#1F4FD1"></path><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path></svg>SBC Capital</div>
    <nav class="nav" aria-label="Console">
      <a class="on" href="v2Board.dc.html"><svg viewBox="0 0 24 24"><path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"></path></svg>Board<span class="ct">7</span></a>
      <a href="v2Companies.dc.html"><svg viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15M9 21v-4h6v4M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"></path></svg>Companies</a>
      <a href="v2Buyers.dc.html"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5zM9 8V5h6v3"></path></svg>Buyers<span class="ct">3</span></a>
      <a href="v2Agents.dc.html"><svg viewBox="0 0 24 24"><path d="M16 20v-1a4 4 0 0 0-8 0v1M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"></path></svg>Agent panel</a>
      <a href="v2Audit.dc.html"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"></path></svg>Audit log</a>
    </nav>
    <div class="me"><span class="av">A</span>Officer A</div>
  </aside>

  <main class="main">
    <div class="top"><a href="v2Board.dc.html">Board</a><span>/</span><b>Northgate Cyber Training</b></div>
    <div class="page">
      <div style="display: flex; align-items: center; gap: 12px">
        <h1>Northgate Cyber Training</h1>
        <span class="badge info">Step 2 · Second check</span>
        <span class="badge err mono">Overdue · 4d</span>
        <span class="mono muted" style="margin-left: auto">v5 · locked 11 Oct</span>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: #F7F8FA; border: 1px solid #E6E8EC; color: #3D4250">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5F6573" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        Officer B's verdict is hidden until you sign.
      </div>

      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start">
        <section class="panel" aria-label="Your review">
          <div class="ph">Your review<span class="ct">{{doneCount}}/5</span></div>
          <div class="row muted" style="font-size: 12px; min-height: 32px; background: #FAFAFB"><span>Check</span><span>Finding</span><span>Your decision</span></div>
          <sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
            <div class="row">
              <span style="font-weight: 500">{{c.name}}</span>
              <a href="v2Evidence.dc.html" style="color: #3D4250; text-decoration: none">{{c.note}}</a>
              <span class="seg2"><button class="{{c.yes}}" onClick="{{c.confirm}}">Confirm</button><button class="{{c.no}}" onClick="{{c.open}}">Query</button></span>
            </div>
          </sc-for>
        </section>

        <section class="panel" aria-label="Sign">
          <div class="ph">Outcome</div>
          <div style="padding: 12px; display: flex; flex-direction: column; gap: 6px">
            <sc-for list="{{outcomes}}" as="o" hint-placeholder-count="3">
              <button class="opt {{o.on}}" onClick="{{o.pick}}"><span class="radio"><span style="width: 6px; height: 6px; border-radius: 999px; background: {{o.dot}}"></span></span>{{o.name}}</button>
            </sc-for>
          </div>
          <div style="border-top: 1px solid #E6E8EC; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
            <div style="display: flex; flex-direction: column"><span class="muted" style="font-size: 12px">Key 1</span><span style="font-weight: 500">Officer B</span><span class="badge ok" style="align-self: flex-start">Signed</span></div>
            <div style="display: flex; flex-direction: column"><span class="muted" style="font-size: 12px">Key 2</span><span style="font-weight: 500">You</span><span class="badge" style="align-self: flex-start">Not signed</span></div>
          </div>
          <div style="border-top: 1px solid #E6E8EC; padding: 12px; display: flex; flex-direction: column; gap: 8px">
            <button class="btn pri" style="justify-content: center; height: 34px">Sign key 2</button>
            <span class="muted" style="font-size: 12px">If the keys disagree, a senior reviewer decides.</span>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
</template>
<script>window.SBC_ROLES = {"v2Login": "officer", "cRegister": "company", "v2Board": "officer", "v2Company": "officer", "pcHome": "company", "pcChecklist": "company", "v2Check": "officer", "v2Evidence": "officer", "v2Plan": "officer", "cPlan": "company", "v2Sign": "officer", "pcQualified2": "company", "bNeed": "buyer", "bNeeds": "buyer", "v2Buyers": "officer", "v2Need": "officer", "v2Introduce": "officer", "cIntros": "company", "bPack": "buyer", "bCheck": "buyer", "v2Companies": "officer", "v2Agents": "officer", "v2Audit": "officer"}; window.SBC_ACTIONS = {"all": {"Messages": {"toast": "Messages is not part of this prototype yet"}, "Open messages": {"toast": "Messages is not part of this prototype yet"}}, "screen": {"Sign key 2": {"toast": "Key 2 signed. The company is SBC-Qualified", "go": "pcQualified2"}}};</script>
<script src="dc-lite.js"></script>
<script>
DCLite.mount(document.getElementById('tpl'), function (DCLogic) {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { pick: 0, d: [true, true, true, true, true] }; }
renderVals() {
  const base = [['Identity', 'Active since 2014'], ['Ownership', 'One owner, 100%'], ['Licences', 'ISO 27001, Cyber Essentials Plus'], ['Screening', 'Clear · run 11 Oct'], ['Readiness', 'Agent appointed · ICV held']];
  const d = this.state.d;
  const set = (i, v) => { const n = d.slice(); n[i] = v; this.setState({ d: n }); };
  const checks = base.map(([name, note], i) => ({ name, note, yes: d[i] ? 'on' : '', no: d[i] ? '' : 'on', confirm: () => set(i, true), open: () => set(i, false) }));
  const outcomes = ['SBC-Qualified', 'Conditionally Qualified', 'Withdraw'].map((name, i) => ({ name, on: this.state.pick === i ? 'on' : '',
    dot: this.state.pick === i ? '#1F4FD1' : 'transparent', pick: () => this.setState({ pick: i }) }));
  return { checks, outcomes, doneCount: d.filter(Boolean).length };
}
}

return Component;
}, document.getElementById('root'));
</script>
</body>
</html>
