<!doctype html>
<html lang="en" class="role-officer look-a" data-home="/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Audit log</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;font-size:13px;line-height:1.5;color:#0F1115;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#1F4FD1}a:hover{color:#163B9E}
.app{display:flex;min-height:900px;background:#FFFFFF}
.side{width:232px;flex:none;background:#FAFAFB;border-right:1px solid #E6E8EC;display:flex;flex-direction:column;gap:16px;padding:12px;box-sizing:border-box}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-weight:600;font-size:14px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:#3D4250;text-decoration:none}
.nav a:hover{background:#F1F2F4;color:#0F1115}
.nav a.on{background:#EBEDF0;color:#0F1115;font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ct{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:#8A8F9C}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;color:#3D4250}
.av{width:22px;height:22px;border-radius:999px;background:#0F1115;color:#FFFFFF;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;border-bottom:1px solid #E6E8EC;display:flex;align-items:center;gap:8px;padding:0 24px;color:#5F6573;box-sizing:border-box}
.top b{color:#0F1115;font-weight:500}
.page{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #E1E3E8;background:#FFFFFF;color:#0F1115;font:500 13px 'Geist',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn:hover{background:#F7F8FA;color:#0F1115}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;background:#F1F2F4;color:#3D4250;gap:4px;white-space:nowrap}
.ok{background:#E9F6EF;color:#0B6B47}.warn{background:#FDF3DF;color:#8A5600}.err{background:#FCEBEA;color:#A8231B}.info{background:#EEF2FD;color:#1F4FD1}
.mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:#8A8F9C}
.tabs{display:flex;gap:16px;border-bottom:1px solid #E6E8EC}
.tabs button{height:36px;border:0;background:transparent;font:500 13px 'Geist',sans-serif;color:#5F6573;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;padding:0 2px}
.tabs button.on{color:#0F1115;border-color:#0F1115}
.tbl{border:1px solid #E6E8EC;border-radius:8px;overflow:hidden}
.tr{display:grid;grid-template-columns:70px 160px minmax(0,2fr) minmax(0,1.2fr) 120px 60px;gap:12px;align-items:center;min-height:40px;padding:0 12px;border-bottom:1px solid #F0F1F3}
.th{min-height:32px;background:#FAFAFB;color:#8A8F9C;font-size:12px}
.day{min-height:28px;display:flex;align-items:center;padding:0 12px;background:#FAFAFB;border-bottom:1px solid #F0F1F3;font-size:11px;font-weight:500;color:#5F6573}
.who{display:flex;align-items:center;gap:8px}
.chip{width:20px;height:20px;border-radius:999px;display:grid;place-items:center;font-size:9px;font-weight:600;flex:none}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,79,209,.35)}50%{box-shadow:0 0 0 4px rgba(31,79,209,0)}}
.page>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}.page>*:nth-child(4){animation-delay:.15s}.page>*:nth-child(5){animation-delay:.2s}
.col .card,.tbl .tr:not(.th),.panel .row,.panel .tr,.claim{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.col .card:nth-of-type(2),.tbl .tr:nth-child(3),.panel .tr:nth-child(3){animation-delay:.06s}
.col .card:nth-of-type(3),.tbl .tr:nth-child(4),.panel .tr:nth-child(4){animation-delay:.12s}
.tbl .tr:nth-child(5),.panel .tr:nth-child(5){animation-delay:.18s}.tbl .tr:nth-child(6),.panel .tr:nth-child(6){animation-delay:.24s}
.tbl .tr:nth-child(7){animation-delay:.3s}.tbl .tr:nth-child(8){animation-delay:.36s}.tbl .tr:nth-child(9){animation-delay:.42s}
.card{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,17,21,.08);border-color:#D5D8DF}
.btn{transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri:hover{box-shadow:0 0 0 3px rgba(31,79,209,.18)}
.card .btn.pri{animation:pulse 2.4s ease-in-out 1s 2}
.nav a{transition:background .15s,color .15s}
.nav a svg{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.nav a:hover svg{transform:translateX(2px)}
.tr,.row,.pick,.claim,.opt{transition:background .15s,border-color .15s}
a.tr:hover,.pick:hover,.claim:hover{background:#F7F8FA}
.pick.on,.claim.on{background:#EEF2FD}
.opt:hover{border-color:#B9C3E0}
.tabs button{transition:color .15s,border-color .2s}
.tabs button:hover{color:#0F1115}
.seg2 button{transition:background .15s,color .15s}
.badge{transition:background .2s,color .2s}
[role=dialog]{animation:pop .24s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}
.seg span,.meter span,.bar span{transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) .2s both}
.seg span:nth-child(2),.meter span:nth-child(2){animation-delay:.26s}.seg span:nth-child(3),.meter span:nth-child(3){animation-delay:.32s}.seg span:nth-child(4),.meter span:nth-child(4){animation-delay:.38s}.seg span:nth-child(5){animation-delay:.44s}
.node{transition:transform .18s,box-shadow .18s}.node:hover{transform:translateX(2px);box-shadow:0 2px 8px rgba(15,17,21,.06)}
.stat{transition:border-color .15s,transform .18s}.stat:hover{border-color:#D5D8DF;transform:translateY(-1px)}
.panel{transition:box-shadow .2s}
:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>

<link rel="stylesheet" href="looks.css">
<script>try{var L=new URLSearchParams(location.search).get("look")||(parent!==window&&parent.SBC_LOOK)||"";if(L)document.documentElement.classList.add("look-"+L)}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div class="app">
  <aside class="side">
    <div class="ws"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#1F4FD1"></path><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path></svg>SBC Capital</div>
    <nav class="nav" aria-label="Console">
      <a href="v2Board.dc.html"><svg viewBox="0 0 24 24"><path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"></path></svg>Board<span class="ct">7</span></a>
      <a href="v2Companies.dc.html"><svg viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15M9 21v-4h6v4M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"></path></svg>Companies</a>
      <a href="v2Buyers.dc.html"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5zM9 8V5h6v3"></path></svg>Buyers<span class="ct">3</span></a>
      <a href="v2Agents.dc.html"><svg viewBox="0 0 24 24"><path d="M16 20v-1a4 4 0 0 0-8 0v1M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"></path></svg>Agent panel</a>
      <a class="on" href="v2Audit.dc.html"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"></path></svg>Audit log</a>
    </nav>
    <div class="me"><span class="av">A</span>Officer A</div>
  </aside>

  <main class="main">
    <div class="top"><b>Audit log</b></div>
    <div class="page">
      <div style="display: flex; align-items: center; gap: 12px">
        <h1>Audit log</h1>
        <span class="muted">Read only</span>
        <span style="margin-left: auto"><button class="btn">Export</button></span>
      </div>
      <div class="tabs">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button class="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
      </div>
      <div class="tbl">
        <div class="tr th"><span>Time</span><span>Who</span><span>Action</span><span>File</span><span>Detail</span><span>Ver.</span></div>
        <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
          <div>
            <div class="day">{{d.day}}</div>
            <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="3">
              <div class="tr">
                <span class="mono muted">{{r.time}}</span>
                <span class="who"><span class="chip" style="background: {{r.bg}}; color: {{r.fg}}">{{r.badge}}</span>{{r.who}}</span>
                <span>{{r.what}}</span>
                <span class="muted">{{r.file}}</span>
                <span><span class="badge {{r.tone}}">{{r.detail}}</span></span>
                <span class="mono muted">{{r.ver}}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</template>
<script>window.SBC_ACTIONS = {"all": {"Messages": {"toast": "Messages is not part of this prototype yet"}, "Open messages": {"toast": "Messages is not part of this prototype yet"}}, "screen": {"Export": {"toast": "Audit log exported as CSV (prototype)"}}};</script>
<script src="dc-lite.js"></script>
<script>
DCLite.mount(document.getElementById('tpl'), function (DCLogic) {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 'All' }; }
renderVals() {
  const W = { A: ['A', 'Officer A', '#0F1115', '#FFFFFF'], B: ['B', 'Officer B', '#5F6573', '#FFFFFF'], AI: ['AI', 'AI agent', '#EEF2FD', '#1F4FD1'], C: ['Co', 'Company', '#F1F2F4', '#3D4250'] };
  const log = [
    ['Today', '10:42', 'A', 'sign', 'Released introduction', 'Brunnvik Water', 'Release', 'info', 'v3'],
    ['Today', '09:12', 'A', 'change', 'Confirmed Identity', 'Halvorsen Water', 'Check', '', 'v3'],
    ['Today', '08:55', 'AI', 'ai', 'Ran screening', 'Pacifica Survey', 'High · clear', 'ok', 'v2'],
    ['Today', '08:40', 'A', 'change', 'Took file', 'Halvorsen Water', 'Assign', '', 'v3'],
    ['Yesterday', '16:20', 'C', 'change', 'Uploaded 2 documents', 'Halvorsen Water', 'New version', '', 'v3'],
    ['Yesterday', '16:18', 'AI', 'ai', 'Prepared 5 checks', 'Halvorsen Water', 'Check · 2 items', 'warn', 'v3'],
    ['Yesterday', '14:31', 'B', 'sign', 'Signed key 1', 'Northgate Cyber', 'Key 1', 'info', 'v5'],
    ['Yesterday', '11:05', 'AI', 'ai', 'Flagged possible sanctions match', 'Varun Rail', 'Low · senior review', 'err', 'v1']
  ];
  const kinds = { All: null, Signatures: 'sign', AI: 'ai', Changes: 'change' };
  const tab = this.state.tab;
  const rows = log.filter((r) => !kinds[tab] || r[3] === kinds[tab]);
  const days = ['Today', 'Yesterday'].map((day) => ({ day, rows: rows.filter((r) => r[0] === day).map((r) => ({
    time: r[1], badge: W[r[2]][0], who: W[r[2]][1], bg: W[r[2]][2], fg: W[r[2]][3], what: r[4], file: r[5], detail: r[6], tone: r[7], ver: r[8] })) })).filter((d) => d.rows.length);
  const tabs = Object.keys(kinds).map((label) => ({ label, on: label === tab ? 'on' : '', pick: () => this.setState({ tab: label }) }));
  return { days, tabs };
}
}

return Component;
}, document.getElementById('root'));
</script>
</body>
</html>
