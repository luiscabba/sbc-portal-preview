}

  const en = this.state.en, m = META[vf[1]];

    tag: d[i] >= 0 ? TAG[d[i]][0] : 'Open', tone: d[i] >= 0 ? TAG[d[i]][1] : '', pick: () => { if (i !== sel) this.think(i); } }));
  const decided = d.filter((x) => x >= 0).length;

    langDe: en ? '' : 'on', langEn: en ? 'on' : '', setDe: () => this.setState({ en: false }), setEn: () => this.setState({ en: true }),
    checks, done, next, ask, hasAsk: first >= 0, thinking: phase === 'think', ready: phase !== 'think', thinkLine: t[0], thinkSub: t[1], lit,
    askN: 'Question ' + (first + 1) + ' of ' + c.facts.length, allAnswered: first < 0,

    bar: st.map((v) => ({ cls: v === 1 ? 'done' : v === 2 ? 'ask' : '' })),

}
}
